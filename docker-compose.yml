version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: erp_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: erp_crm_server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/erp_crm
      JWT_SECRET: super-secret-jwt-key-for-production-change-this
      JWT_EXPIRES_IN: 24h
      PORT: 5000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npm start"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: erp_crm_client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
